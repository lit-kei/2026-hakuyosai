<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IDプロフィール確認 | 柏葉祭カジノ</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main class="app-shell kiosk-shell">
      <header class="topbar kiosk-topbar">
        <div class="brand">
          <h1 class="brand-title">プロフィール確認</h1>
          <span class="brand-subtitle">6文字IDを入力してください</span>
        </div>
      </header>

      <section class="panel">
        <h2>ID入力</h2>
        <form id="lookupForm" class="stack">
          <label class="field">
            <span>公開ID</span>
            <input id="lookupPublicId" class="id-input" maxlength="6" inputmode="latin" autocomplete="off" placeholder="ABC123" required>
          </label>
          <button id="lookupButton" type="submit">プロフィールを見る</button>
          <p id="lookupMessage" class="message" hidden></p>
        </form>
      </section>

      <section id="resultPanel" class="panel hidden">
        <div id="lookupRoomCard" class="room-status is-loading">
          <span class="label">現在の所属部屋</span>
          <p id="lookupRoom" class="room-status-name">確認中</p>
          <p id="lookupRoomDetail" class="room-status-detail">部屋が変わると自動で更新されます。</p>
        </div>

        <h2>プロフィール</h2>
        <p id="lookupName" class="current-name"></p>
        <dl class="meta-list">
          <div class="meta-row">
            <dt>公開ID</dt>
            <dd id="lookupPublicIdDisplay"></dd>
          </div>
          <div class="meta-row">
            <dt>現在資産</dt>
            <dd id="lookupBalance" class="profile-balance"></dd>
          </div>
        </dl>
      </section>
    </main>

    <script type="module" src="assets/js/lookup.js"></script>
  </body>
</html>
