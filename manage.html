<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>運営管理 | 柏葉祭カジノ</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1 class="brand-title">運営管理</h1>
          <span class="brand-subtitle">参加者のゲーム内資産を管理します</span>
        </div>
        <nav class="nav-links" aria-label="ページ">
          <a href="manage.html">管理</a>
          <a href="room.html">部屋</a>
        </nav>
      </header>
      <section id="adminLoginPanel" class="panel">
        <h2>管理者ログイン</h2>

        <form id="adminLoginForm" class="stack">
          <label class="field">
            <span>管理者パスワード</span>
            <input
              id="adminPassword"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>

          <button id="adminLoginButton" type="submit">
            ログイン
          </button>

          <p
            id="adminLoginMessage"
            class="message"
            hidden
          ></p>
        </form>
      </section>

      <section id="mainPanel" class="hidden">
        <div class="grid">
          <section class="panel">
            <h2>ユーザー検索</h2>
            <div class="stack">
              <label class="field">
                <span>表示名またはユーザーID</span>
                <input id="searchInput" type="search" placeholder="例: Alice">
              </label>
              <p id="userListMessage" class="message info">ユーザーを読み込み中です。</p>
              <div id="userList" class="user-list"></div>
            </div>
          </section>

          <section class="panel">
            <h2>選択中のユーザー</h2>
            <div id="emptySelection" class="message info">ユーザーを選択してください。</div>
            <div id="selectedUserPanel" class="stack hidden">
              <dl class="meta-list">
                <div class="meta-row">
                  <dt>表示名</dt>
                  <dd id="selectedName"></dd>
                </div>
                <div class="meta-row">
                  <dt>ユーザーID</dt>
                  <dd id="selectedId"></dd>
                </div>
              </dl>
              <div>
                <span class="label">現在の資産</span>
                <p id="selectedBalance" class="balance-display"></p>
              </div>
            </div>
          </section>
        </div>

        <section id="assetPanel" class="panel hidden">
          <h2>資産操作</h2>
          <div class="grid">
            <div class="stack">
              <h3>すばやく変更</h3>
              <div class="button-grid">
                <button class="quickAmount" data-amount="100" type="button">+100</button>
                <button class="quickAmount" data-amount="500" type="button">+500</button>
                <button class="quickAmount button-danger" data-amount="-100" type="button">-100</button>
                <button class="quickAmount button-danger" data-amount="-500" type="button">-500</button>
              </div>
            </div>

            <form id="adjustForm" class="stack">
              <h3>金額を指定</h3>
              <label class="field">
                <span>金額</span>
                <input id="adjustAmount" type="number" inputmode="numeric" min="1" step="1">
              </label>
              <div class="button-grid">
                <button id="addButton" name="direction" value="add" type="submit">追加</button>
                <button id="subtractButton" class="button-danger" name="direction" value="subtract" type="submit">減少</button>
              </div>
            </form>

            <form id="setBalanceForm" class="stack">
              <h3>残高を直接変更</h3>
              <label class="field">
                <span>変更後の残高</span>
                <input id="setBalanceAmount" type="number" inputmode="numeric" min="0" step="1">
              </label>
              <button id="setBalanceButton" type="submit">変更</button>
            </form>
          </div>
          <p id="assetMessage" class="message" hidden></p>
        </section>

        <section id="transactionsPanel" class="panel hidden">
          <h2>直近の取引履歴</h2>
          <p id="transactionMessage" class="message info">取引履歴を読み込み中です。</p>
          <ul id="transactionList" class="transaction-list"></ul>
        </section>
      </section>
    </main>

    <script type="module" src="assets/js/manage.js"></script>
  </body>
</html>
