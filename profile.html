<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>プロフィール | 柏葉祭カジノ</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1 class="brand-title">プロフィール</h1>
          <span class="brand-subtitle">公開ID、QRコード、現在資産を確認できます</span>
        </div>

        <nav id="profileNav" class="nav-links" aria-label="ページ">
          <a href="profile.html">プロフィール</a>
          <a href="ranking.html">ランキング</a>
        </nav>

          <button
          id="logoutButton"
          class="button-danger hidden"
          type="button"
        >
          ログアウト
        </button>
      </header>

      <section id="loadingPanel" class="panel">
        <p class="message info">読み込み中です。</p>
      </section>

      <section id="profilePanel" class="panel hidden">
        <div id="currentRoomCard" class="room-status is-loading">
          <span class="label">現在の所属部屋</span>
          <p id="currentRoom" class="room-status-name">確認中</p>
          <p id="currentRoomDetail" class="room-status-detail">部屋が変わると自動で更新されます。</p>
        </div>

        <h2>現在の表示名</h2>
        <p id="currentName" class="current-name"></p>
        <dl class="meta-list">
          <div class="meta-row">
            <dt>公開ID</dt>
            <dd id="publicId"></dd>
          </div>
          <div class="meta-row">
            <dt>現在資産</dt>
            <dd id="balance" class="profile-balance"></dd>
          </div>
        </dl>
        <div class="qr-profile">
          <span class="label" id="qrLabel">入室用QRコード</span>
          <div id="qrCode" class="qr-code"></div>
          <p class="help-text" id="help-message">QRコードが使えない場合は、公開IDをスタッフに伝えてください。</p>
        </div>
      </section>

      <section id="renamePanel" class="panel hidden">
        <h2>表示名変更</h2>
        <form id="renameForm" class="stack">
          <label class="field">
            <span>新しい表示名</span>
            <input id="renameName" name="displayName" autocomplete="nickname" maxlength="24" required>
          </label>
          <button id="renameButton" type="submit">変更する</button>
          <p id="renameMessage" class="message" hidden></p>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script type="module" src="assets/js/profile.js"></script>
  </body>
</html>
