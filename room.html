<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>部屋管理 | オキナシステム</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1 class="brand-title">部屋管理</h1>
          <span class="brand-subtitle">部屋を作成し、個別の部屋へ移動します</span>
        </div>
        <nav class="nav-links" aria-label="ページ">
          <a href="manage.html">管理</a>
          <a href="room.html">部屋</a>
        </nav>
      </header>
      <section id="adminLoadingPanel" class="panel">
        <p class="message info">管理者ログイン状態を確認中です。</p>
      </section>

      <section id="adminLoginPanel" class="panel hidden">
        <h2>管理者ログイン</h2>

        <form id="adminLoginForm" class="stack">
          <label class="field">
            <span>管理者メールアドレス</span>
            <input
              id="adminEmail"
              type="email"
              autocomplete="username"
              required
            >
          </label>
          <label class="field">
            <span>管理者パスワード</span>
            <input
              id="adminPassword"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>

          <button id="adminLoginButton" type="submit">
            ログイン
          </button>

          <p
            id="adminLoginMessage"
            class="message"
            hidden
          ></p>
        </form>
      </section>

      <section id="mainPanel" class="hidden">
        <section class="panel">
          <h2>部屋を作成</h2>
          <form id="roomForm" class="stack">
            <label class="field">
              <span>部屋名</span>
              <input id="roomName" maxlength="32" required placeholder="例: ポーカー卓A">
            </label>
            <button id="createRoomButton" type="submit">作成する</button>
            <p id="roomFormMessage" class="message" hidden></p>
          </form>
        </section>

        <section class="panel">
          <h2>部屋一覧</h2>
          <p id="roomListMessage" class="message info">部屋を読み込み中です。</p>
          <div id="roomList" class="room-list"></div>
        </section>
      </section>
    </main>

    <script type="module" src="assets/js/room.js"></script>
  </body>
</html>
