<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>運営管理 | 柏葉祭カジノ</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1 class="brand-title">運営管理</h1>
          <span class="brand-subtitle">参加者のゲーム内資産を管理します</span>
        </div>
        <nav class="nav-links" aria-label="ページ">
          <a href="manage.html">管理</a>
          <a href="room.html">部屋</a>
        </nav>
      </header>
      <section id="adminLoginPanel" class="panel">
        <h2>管理者ログイン</h2>

        <form id="adminLoginForm" class="stack">
          <label class="field">
            <span>管理者パスワード</span>
            <input
              id="adminPassword"
              type="password"
              autocomplete="current-password"
              required
            >
          </label>

          <button id="adminLoginButton" type="submit">
            ログイン
          </button>

          <p
            id="adminLoginMessage"
            class="message"
            hidden
          ></p>
        </form>
      </section>

      <section id="mainPanel" class="hidden">
      </section>
    </main>

    <script type="module" src="assets/js/room.js"></script>
  </body>
</html>
