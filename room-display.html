<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>部屋ディスプレイ | 柏葉祭カジノ</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="display-page">
    <main class="display-shell">
      <header class="display-header">
        <div>
          <p class="display-kicker">ROOM DISPLAY</p>
          <h1 id="roomTitle">部屋ディスプレイ</h1>
        </div>
        <div class="display-header-tools">
          <div class="display-sort" aria-label="並び替え">
            <button type="button" class="is-active" data-sort="join">入室順</button>
            <button type="button" data-sort="balance">資産順</button>
            <button type="button" data-sort="delta">収支順</button>
          </div>
          <div class="display-summary" aria-label="参加人数">
            <span id="memberCount">0</span>
            <small>参加中</small>
          </div>
        </div>
      </header>

      <section id="displayScroller" class="display-scroll-area">
        <p id="displayMessage" class="message info">参加者を読み込み中です。</p>
        <section id="displayList" class="display-list" aria-label="部屋の参加者一覧"></section>
      </section>
    </main>

    <script type="module" src="assets/js/room-display.js"></script>
  </body>
</html>
