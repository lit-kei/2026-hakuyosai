<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>個別部屋管理 | 柏葉祭カジノ</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.section-header h2 {
  margin: 0;
  font-size: 1.15rem;
}

.batch-status {
  display: flex;
  align-items: center;
  gap: 8px;
}

#pendingCount {
  color: var(--muted);
  font-size: 0.82rem;
  white-space: nowrap;
}

#saveBalancesButton {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.85rem;
  white-space: nowrap;
}


/* 4人/1行 */
.member-list {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}


/* 1ユーザーのカード */
.member-card {
  position: relative;
  display: grid;
  gap: 6px;
  min-width: 0;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
}

.member-card.is-dragging {
  opacity: 0.55;
}

.member-card.is-drag-over {
  border-color: var(--primary);
  background: #edf7f6;
}

.member-card.is-drop-before,
.member-card.is-drop-after {
  border-color: var(--primary);
  background: #edf7f6;
}

.member-card.is-drop-before::before,
.member-card.is-drop-after::after {
  position: absolute;
  right: 6px;
  left: 6px;
  z-index: 2;
  height: 5px;
  border-radius: 999px;
  background: var(--primary);
  box-shadow: 0 0 0 3px rgba(17, 100, 102, 0.16);
  content: "";
}

.member-card.is-drop-before::before {
  top: -7px;
}

.member-card.is-drop-after::after {
  bottom: -7px;
}

.member-list.is-sorting {
  gap: 14px 8px;
}

.member-drop-zone {
  display: none;
  grid-column: 1 / -1;
  min-height: 38px;
  place-items: center;
  border: 2px dashed var(--line);
  border-radius: 7px;
  background: #f7faf9;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 900;
}

.member-list.is-sorting .member-drop-zone {
  display: grid;
}

.member-drop-zone.is-drop-active {
  border-color: var(--primary);
  background: #dff2ef;
  color: var(--primary-dark);
}

.member-drag-handle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 28px;
  padding: 4px 7px;
  border: 1px dashed var(--line);
  border-radius: 5px;
  background: #f7faf9;
  color: var(--muted);
  font-size: 0.68rem;
  font-weight: 800;
  line-height: 1.1;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.member-drag-handle:hover {
  border-color: var(--primary);
  background: #edf7f6;
  color: var(--primary-dark);
}

.member-drag-handle:active {
  cursor: grabbing;
}

.member-drag-handle::before {
  content: "つかんで移動";
}

.member-drag-grip {
  color: var(--muted);
  font-size: 1rem;
  letter-spacing: 0.12em;
}

.member-drag-handle:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}


/* 名前・残高 */
.member-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 5px;
}

.member-header > div:first-child {
  display: grid;
  gap: 0;
  min-width: 0;
}

.member-header strong {
  overflow: hidden;
  font-size: 0.95rem;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.member-header > div:first-child span {
  overflow: hidden;
  color: var(--muted);
  font-size: 0.68rem;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}


/* 残高 + 今回収支 */
.member-balance-area {
  display: grid !important;
  justify-items: end;
  gap: 0 !important;
}

.member-balance {
  margin: 0;
  font-size: 1rem;
  line-height: 1.1;
  font-weight: 900;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.member-delta {
  font-size: 0.82rem !important;
  line-height: 1.15;
  font-weight: 900;
  white-space: nowrap;
}

.member-delta.positive {
  color: var(--success) !important;
}

.member-delta.negative {
  color: var(--danger) !important;
}


/* ±500 / ±100 */
.balance-controls {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 3px;
}

.balance-button {
  min-width: 0;
  min-height: 32px;
  padding: 3px 2px;
  border-radius: 5px;
  font-size: 0.73rem;
}


/* プラス */
.balance-plus {
  background: var(--primary);
  color: #fff;
}

.balance-plus:hover {
  background: var(--primary-dark);
}


/* マイナスは赤 */
.balance-minus {
  background: var(--danger);
  color: #fff;
}

.balance-minus:hover {
  background: #8d2f27;
}


/* リセット・退出 */
.member-sub-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
}

.member-sub-actions button {
  min-height: 29px;
  padding: 3px 5px;
  border-radius: 5px;
  font-size: 0.7rem;
}


/* タブレット */
@media (max-width: 900px) {
  .member-list {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}


/* スマホ横幅 */
@media (max-width: 680px) {
  .member-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .section-header {
    align-items: stretch;
    flex-direction: column;
    gap: 6px;
  }

  .batch-status {
    justify-content: space-between;
  }

  /*
    styles.css側でモバイル時に
    button { min-height: 56px }
    になるため、この画面だけ再上書き
  */
  .balance-button {
    min-height: 38px;
  }

  .member-sub-actions button {
    min-height: 34px;
  }

  .member-balance {
    font-size: 0.95rem;
  }
}


/* 非常に狭い画面 */
@media (max-width: 420px) {
  .member-list {
    grid-template-columns: 1fr;
  }
}
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1 id="roomTitle" class="brand-title">個別部屋管理</h1>
          <span class="brand-subtitle">部屋内の参加者と資産を管理します</span>
        </div>
        <nav class="nav-links" aria-label="ページ">
          <a href="room.html">部屋一覧</a>
          <a id="scanLink" href="room-scan.html">QR/ID追加</a>
          <a id="displayLink" href="room-display.html">ディスプレイ</a>
          <a href="manage.html">管理</a>
        </nav>
      </header>

      <section id="adminLoadingPanel" class="panel">
        <p class="message info">管理者ログイン状態を確認中です。</p>
      </section>

      <section id="adminLoginPanel" class="panel hidden">
        <h2>管理者ログイン</h2>
        <form id="adminLoginForm" class="stack">
          <label class="field">
            <span>管理者メールアドレス</span>
            <input id="adminEmail" type="email" autocomplete="username" required>
          </label>
          <label class="field">
            <span>管理者パスワード</span>
            <input id="adminPassword" type="password" autocomplete="current-password" required>
          </label>
          <button id="adminLoginButton" type="submit">ログイン</button>
          <p id="adminLoginMessage" class="message" hidden></p>
        </form>
      </section>

      <section id="mainPanel" class="hidden">
        <section class="panel">
          <div class="room-actions">
            <div>
              <span class="label">部屋</span>
              <p id="roomNameDisplay" class="current-name"></p>
            </div>
            <div class="room-action-links">
              <a id="displayButton" class="link-button" href="room-display.html">ディスプレイ表示</a>
              <a id="scanButton" class="link-button primary-link" href="room-scan.html">QR/IDで参加者追加</a>
            </div>
          </div>
          <p id="roomMessage" class="message" hidden></p>
        </section>
        <section class="panel">
          <div class="section-header">
            <h2>参加者</h2>

            <div class="batch-status">
              <span id="pendingCount">変更なし</span>
              <button id="saveBalancesButton" type="button" disabled>
                収支を一括保存
              </button>
            </div>
          </div>

          <p id="memberMessage" class="message info">
            参加者を読み込み中です。
          </p>

          <div id="memberList" class="member-list"></div>
        </section>
      </section>
    </main>

    <script type="module" src="assets/js/room-detail.js"></script>
  </body>
</html>
