<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>参加者ログイン | 柏葉祭カジノ</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1 class="brand-title">参加者ログイン</h1>
          <span class="brand-subtitle">柏葉祭カジノ 資産管理</span>
        </div>
        <nav class="nav-links" aria-label="ページ" id="signinNav">
          <a href="profile.html">プロフィール</a>
          <a href="ranking.html">ランキング</a>
        </nav>
      </header>

      <section id="loadingPanel" class="panel">
        <p class="message info">読み込み中です。</p>
      </section>

      <section id="loginPanel" class="panel hidden">
        <h2>6文字IDでログイン</h2>
        <form id="loginForm" class="stack">
          <label class="field">
            <span>公開ID</span>
            <input id="loginPublicId" maxlength="6" inputmode="latin" autocomplete="off" placeholder="ABC123" required>
          </label>
          <button id="loginButton" type="submit">ログイン</button>
          <p id="loginMessage" class="message" hidden></p>
        </form>
      </section>

      <section id="createPanel" class="panel hidden">
        <h2>新規アカウント作成</h2>
        <form id="createForm" class="stack">
          <label class="field">
            <span>ユーザー名</span>
            <input id="createName" name="displayName" autocomplete="nickname" maxlength="12" pattern="[A-Za-z0-9_-]{1,12}" placeholder="Alice_01" required>
          </label>
          <p class="help-text">英数字、ハイフン、アンダースコアのみ。1〜12文字で、他の人と同じ名前は使えません。</p>
          <button id="createButton" type="submit">作成してプロフィールへ</button>
          <p id="createMessage" class="message" hidden></p>
        </form>
      </section>
    </main>

    <div id="busyOverlay" class="busy-overlay hidden" role="status" aria-live="polite" aria-busy="true">
      <div class="busy-card">
        <div class="busy-spinner" aria-hidden="true"></div>
        <p id="busyText">処理中です。</p>
      </div>
    </div>

    <script type="module" src="assets/js/signin.js"></script>
  </body>
</html>
