<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>参加者アカウント | 白楊祭カジノ</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1 class="brand-title">参加者アカウント</h1>
          <span class="brand-subtitle">白楊祭カジノ 資産管理</span>
        </div>
        <nav class="nav-links" aria-label="ページ">
          <a href="signin.html">参加者</a>
          <a href="ranking.html">ランキング</a>
          <a href="manage.html">管理</a>
        </nav>
      </header>

      <section id="loadingPanel" class="panel">
        <p class="message info">読み込み中です。</p>
      </section>

      <section id="createPanel" class="panel hidden">
        <h2>アカウント作成</h2>
        <form id="createForm" class="stack">
          <label class="field">
            <span>表示名</span>
            <input id="createName" name="displayName" autocomplete="nickname" maxlength="24" required>
          </label>
          <button id="createButton" type="submit">作成する</button>
          <p id="createMessage" class="message" hidden></p>
        </form>
      </section>

      <section id="accountPanel" class="panel hidden">
        <h2>現在の表示名</h2>
        <p id="currentName" class="current-name"></p>
        <dl class="meta-list">
          <div class="meta-row">
            <dt>ユーザーID</dt>
            <dd id="userId"></dd>
          </div>
        </dl>
      </section>

      <section id="renamePanel" class="panel hidden">
        <h2>表示名変更</h2>
        <form id="renameForm" class="stack">
          <label class="field">
            <span>新しい表示名</span>
            <input id="renameName" name="displayName" autocomplete="nickname" maxlength="24" required>
          </label>
          <button id="renameButton" type="submit">変更する</button>
          <p id="renameMessage" class="message" hidden></p>
        </form>
      </section>
    </main>

    <script type="module" src="assets/js/signin.js"></script>
  </body>
</html>
